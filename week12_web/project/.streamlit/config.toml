# Streamlit settings for this kit. Streamlit reads this file when you run `streamlit run streamlit_app.py` from inside the project folder (the kit folder has its own copy).

[server]
# Only this computer can open the app. Without this line, Streamlit listens on every network
# address, so anyone on the same Wi-Fi could use your app (and your Claude plan's usage).
address = "localhost"

[browser]
# Don't send usage statistics to Streamlit.
gatherUsageStats = false
